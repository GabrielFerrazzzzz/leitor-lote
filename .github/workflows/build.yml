name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pyinstaller leitor-lote.spec
      - name: Zipar (versão portátil, sem instalar)
        run: |
          Compress-Archive -Path dist/leitor-lote/* -DestinationPath leitor-lote-${{ github.ref_name }}.zip
          Copy-Item leitor-lote-${{ github.ref_name }}.zip leitor-lote-windows.zip
      - name: Instalar Inno Setup
        run: choco install -y innosetup
      - name: Compilar instalador
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss "/DMyAppVersion=$ver"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            leitor-lote-setup.exe
            leitor-lote-${{ github.ref_name }}.zip
            leitor-lote-windows.zip
