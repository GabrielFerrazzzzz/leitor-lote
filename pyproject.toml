[project]
name = "leitor-lote"
version = "0.2.3"
description = "Leitor de canhotos em lote, local (OCR/IA), com motor escolhivel"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "transformers>=4.44",
    "torch>=2.4",
    "httpx>=0.27",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python>=4.10",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pyinstaller>=6.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leitor_lote"]

[tool.pytest.ini_options]
markers = ["manual: exercita libs/APIs reais, nao roda no CI"]
addopts = "-m 'not manual'"

[tool.ruff]
line-length = 100
target-version = "py312"
